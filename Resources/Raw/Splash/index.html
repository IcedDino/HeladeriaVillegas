<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff7f9; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Helado girando"></canvas>
  <script>
    window.addEventListener('error', e => window.chrome?.webview?.postMessage('error: ' + e.message));
    window.addEventListener('unhandledrejection', e => window.chrome?.webview?.postMessage('error: ' + String(e.reason)));
  </script>
  <script type="module" src="./splash.js"></script>
</body>
</html>
